name = "social-poster"
main = "src/index.js"
compatibility_date = "2026-08-16"

[observability]
enabled = true
head_sampling_rate = 1

# Workers AI binding for LLM-generated posts
[ai]
binding = "AI"

# KV namespace for tracking posted articles
# NOTE: Replace this ID with your own namespace created via `wrangler kv namespace create POSTED_STATE`
[[kv_namespaces]]
binding = "POSTED_STATE"
id = "a439712ab156465da731909fecc56b09"

# Scheduled triggers - runs every 6 hours
[triggers]
crons = ["0 */6 * * *"]

# Environment variables (non-secret)
[vars]
RSS_URL = "https://philippdubach.com/posts/index.xml"
SITE_NAME = "philippdubach.com"

[[queues.producers]]
binding = "POST_QUEUE"
queue = "social-poster-post-jobs"

[[queues.consumers]]
queue = "social-poster-post-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "social-poster-post-jobs-dlq"
max_concurrency = 1
retry_delay = 300

[[queues.consumers]]
queue = "social-poster-post-jobs-dlq"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1

[[durable_objects.bindings]]
name = "POST_GATE"
class_name = "PostGate"

[exports.PostGate]
type = "durable-object"
storage = "sqlite"
