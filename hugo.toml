baseURL = 'https://philippdubach.com/'
locale = 'en-us'
title = 'Philipp D. Dubach'
timeZone = 'Europe/Zurich'
enableRobotsTXT = true
enableGitInfo = true
capitalizeListTitles = false

[pagination]
  pagerSize = 20
  path = 'page'

[services]
  [services.rss]
    # Full-content feeds without a cap reached 1.8 MB at 88 posts and grow
    # with every article; readers only need recent items (archive: /writing/).
    limit = 25

[params]
  author = 'Philipp D. Dubach'
  description = "Exploring the intersection of Macroeconomics, Quantitative Finance, and AI infrastructure. Analysis of LLM unit economics, global monetary frameworks, and systemic liquidity."
  keywords = ["Quantitative Finance", "Macro Strategy", "AI Infrastructure", "Machine Learning", "Asset Allocation", "Bretton Woods III", "Python for Finance"]
  rssFeedDescription = 'full'
  site_name = 'Philipp D. Dubach'
  locale = 'en_US'
  default_image = 'https://static.philippdubach.com/ograph/ograph-post.jpg'
  theme_color = '#ffffff'
  msapplication_tile_color = '#ffffff'

  [params.social]
    github = "philippdubach"
    email = "me@philippdubach.com"
    bluesky = "philippdubach.com"
    twitter = "philippdubach"
    linkedin = "philippdubach"

  [params.newsletter]
    preview = false
    endpoint = 'https://newsletter-api.philippd.workers.dev/api/subscribe'
    count_endpoint = 'https://newsletter-api.philippd.workers.dev/api/subscriber-count'

  [params.academic]
    google_scholar = 'https://scholar.google.com/citations?user=-69oS2wAAAAJ&hl=en'
    researchgate = 'https://www.researchgate.net/profile/Philipp-Dubach'
    orcid = 'https://orcid.org/0009-0002-3126-6760'
    ssrn = 'https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=9538192#form1'
    arxiv = 'https://arxiv.org/search/q-fin?searchtype=author&query=Dubach,+P+D'

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[permalinks]
  posts = '/posts/:slug/'

[frontmatter]
  date = ['date', 'publishDate', 'lastmod']
  lastmod = [':git', 'lastmod', 'date', 'publishDate']
  publishDate = ['publishDate', 'date']
  expiryDate = ['expiryDate']

[taxonomies]
  category = 'categories'
  type = 'types'
  tag = 'tags'

[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = 'categories'
    weight = 100
  [[related.indices]]
    name = 'tags'
    weight = 80
  [[related.indices]]
    name = 'keywords'
    weight = 60
  [[related.indices]]
    name = 'date'
    weight = 10

[mediaTypes]
  [mediaTypes.'application/feed+json']
    suffixes = ['json']
  [mediaTypes.'application/linkset+json']
    suffixes = ['json']

[outputFormats]
  [outputFormats.JSONFeed]
    mediaType = 'application/feed+json'
    baseName = 'feed'
    isPlainText = true
  [outputFormats.PostsAPI]
    mediaType = 'application/json'
    baseName = 'posts'
    isPlainText = true
    path = 'api'
  [outputFormats.LLMSTxt]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMSFullTxt]
    mediaType = 'text/plain'
    baseName = 'llms-full'
    isPlainText = true
    notAlternative = true
  [outputFormats.Markdown]
    notAlternative = true
  [outputFormats.APICatalog]
    mediaType = 'application/linkset+json'
    baseName = 'api-catalog'
    isPlainText = true
    notAlternative = true
    rel = 'api-catalog'

[outputs]
  home = ['HTML', 'RSS', 'JSONFeed', 'PostsAPI', 'LLMSTxt', 'LLMSFullTxt', 'Sitemap', 'Markdown', 'APICatalog']
  page = ['HTML', 'Markdown']
  section = ['HTML', 'RSS', 'Sitemap', 'Markdown']
  taxonomy = ['HTML', 'RSS', 'Markdown']
  term = ['HTML', 'RSS', 'Markdown']
