{{ define "main" }}
  <main id="main-content" class="standalone-page faq-page" tabindex="-1">
    <article>
      <header class="page-heading"><h1>{{ .Title }}</h1>{{ with .Description }}<p class="page-intro">{{ . }}</p>{{ end }}</header>
      <div class="article-body">{{ .Content }}</div>
      {{ with .Params.faq }}<dl class="faq-list">{{ range . }}<dt>{{ .question }}</dt><dd>{{ .answer | markdownify }}</dd>{{ end }}</dl>{{ end }}
    </article>
  </main>
{{ end }}
