{{- /* Keep native table semantics and give wide tables their own scroll area. */ -}}
<div class="table-scroll" tabindex="0" role="region" aria-label="Table {{ add .Ordinal 1 }} (scroll horizontally)">
  <table
    {{- range $key, $value := .Attributes }}
      {{- if $value }}{{ printf " %s=%q" $key $value | safeHTMLAttr }}{{ end }}
    {{- end }}>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th scope="col"{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
