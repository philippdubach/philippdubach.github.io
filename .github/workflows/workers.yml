name: Validate Workers

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: social-automation/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefix social-automation --ignore-scripts
      - name: Test Worker workspace
        run: npm test --prefix social-automation
      - name: Dry-run Worker deployments
        run: npm run check --prefix social-automation
