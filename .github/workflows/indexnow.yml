# Submit recently updated URLs to search engines via IndexNow protocol
# Runs after each successful standby deployment and on manual dispatch.
name: IndexNow

on:
  # Run after Hugo deployment completes
  workflow_run:
    workflows: ["Deploy Hugo site to Pages"]
    types:
      - completed
  
  # Manual trigger for testing
  workflow_dispatch:

# The job uses no GitHub token; grant it nothing.
permissions: {}

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    # Only run if standby deployment succeeded (or on manual trigger)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Verify apex IndexNow key
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          test -n "$INDEXNOW_KEY"
          response="$(curl --fail --silent --show-error --max-time 15 "https://philippdubach.com/${INDEXNOW_KEY}.txt")"
          test "$response" = "$INDEXNOW_KEY"
      - name: Submit to IndexNow
        # Pinned to v3.0.0 commit SHA for supply chain security
        # Check for updates: https://github.com/bojieyang/indexnow-action/releases
        uses: bojieyang/indexnow-action@38ddfbd93579a8a44c0dee662121bf9d51098f71 # v3.0.0
        with:
          sitemap-location: 'https://philippdubach.com/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
          since: 1
          since-unit: 'day'
          limit: 1000
          endpoint: 'api.indexnow.org'  # Shares with all participating engines
