# Workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Scheduled rebuilds for future-dated posts are dispatched by the
  # Cloudflare Worker `build-trigger` (every 3 hours), which calls
  # workflow_dispatch below. Worker source: social-automation/build-trigger/
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && echo "b4fab4477743c0f1fcfe85072a71156d78f97e4724f0d8bb3b1b1ff2f53ce3ac  ${{ runner.temp }}/hugo.deb" | sha256sum -c \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          # baseURL is hardcoded: the Pages deployment exists solely as a warm
          # standby for the apex domain, so its absolute URLs must match
          # production regardless of the Pages custom-domain setting.
          # --panicOnWarning keeps CI as strict as the local npm run build.
          hugo \
            --gc \
            --minify \
            --panicOnWarning \
            --baseURL "https://philippdubach.com/"
      - name: Validate release before upload
        run: npm run check:built
      - name: Setup IndexNow key file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -n "$INDEXNOW_KEY" ] && [ ${#INDEXNOW_KEY} -ge 8 ]; then
            echo "$INDEXNOW_KEY" > "./public/${INDEXNOW_KEY}.txt"
          else
            echo "::warning::INDEXNOW_KEY secret not set or invalid, skipping verification file"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Purge Cloudflare Cache
        # Push events only: scheduled workflow_dispatch rebuilds refresh the
        # Pages standby, which the edge does not serve — purging for them
        # evicts the whole cache 8x/day and stampedes the origin for nothing.
        # Scheduled publications on the primary purge from the Hetzner build.
        if: success() && github.event_name == 'push'
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq --exit-status '.success == true'

      - name: Notify social posters
        if: success() && github.event_name == 'push'
        env:
          SOCIAL_API_SECRET: ${{ secrets.SOCIAL_API_SECRET }}
          BLUESKY_TRIGGER_URL: ${{ secrets.BLUESKY_TRIGGER_URL }}
          TWITTER_TRIGGER_URL: ${{ secrets.TWITTER_TRIGGER_URL }}
        run: |
          curl -X POST -H "Authorization: Bearer $SOCIAL_API_SECRET" \
            --max-time 10 --retry 2 \
            "$BLUESKY_TRIGGER_URL" || echo "bluesky webhook returned non-zero (fire-and-forget)"
          curl -X POST -H "Authorization: Bearer $SOCIAL_API_SECRET" \
            --max-time 10 --retry 2 \
            "$TWITTER_TRIGGER_URL" || echo "twitter webhook returned non-zero (fire-and-forget)"
